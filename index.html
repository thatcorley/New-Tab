<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Super Duper Epic Tab</title>

        <script type="module" src="scripts/saveManager.js"></script>
    </head>
    <body>
        <div id="fog">
        </div>
        <script src="scripts/market/three.r134.min.js"></script>
        <script src="scripts/market/vanta.fog.min.js"></script>
        <script>
        VANTA.FOG({
            el: "#fog",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            highlightColor: 0x48003a,
            midtoneColor: 0x110022,
            lowlightColor: 0x4500a2,
            baseColor: 0x0,
            blurFactor: 0.5,
            speed: 1,
            zoom: 1
        })
        </script>
        <div class="content">
            <div id="dateTime">
                <h1 id="time">00:00</h1>
                <!-- <h2 id="date">Wednesday 16th 2026</h1> -->
            </div>

            <div id="search-bar">
                <!-- <h2>Search Bar Here</h2> -->
                <input type="search" id="search-bar-input" name="search-bar" placeholder="Search on Google" autofocus autocomplete="off">
                <button id="search-bar-submit">🔎︎</button>
            </div>

            <div id="widgets">
                <div id="shortcuts" class="widget">
                    <div style="position: relative; display: flex; justify-content: center; align-items: center;">
                        <h2 >Shortcuts</h2>
                        <div style="position: absolute; right: 0; display: flex; gap: 0.5rem; margin-right: 1rem;">
                            <p style="text-align: center;" id="bin-shortcut">🗑️</p>
                            <p style="text-align: center;" id="add-shortcut">➕</p>
                        </div>
                    </div>
                    
                    <hr>
                    <div id="shortcuts-grid"></div>
                </div>

                <div id="quick-notes" class="widget">
                    <div>
                        <h2>Quick Notes</h2>
                        <hr>
                    </div>
                    <textarea name="quick-notes" id="quick-notes-text"></textarea>
                </div>

                <div id="password-gen" class="widget">
                    <h2>Super Duper Secure Password</h2>
                    <hr>
                    <div style="display: flex; justify-content: center; align-items: center; flex-direction: column;">
                        <h1 id="genned_pass">PASSWORD</h1>
                        <h3 style="border: white solid 5px; border-radius: 10px; width: 10rem;" id="gen_pass">GENERATE</h3>
                    </div>
                </div>
            </div>
        </div>

        <footer>By ThatCorley</footer>

        <script src="scripts/main.js"></script>
        <script type="module" src="scripts/shortcuts.js"></script>
        <script type="module" src="scripts/notes.js"></script>
        <script src="scripts/password.js"></script>
    </body>
</html>
