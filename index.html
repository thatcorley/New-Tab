<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="css/style.css">
        <title>Super Duper Epic Tab</title>

        <script type="module" src="scripts/saveManager.js"></script>
    </head>
    <body>
        <div id="fog">
        </div>
        <script src="scripts/market/three.r134.min.js"></script>
        <script src="scripts/market/vanta.fog.min.js"></script>
        <script>
        VANTA.FOG({
            el: "#fog",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            highlightColor: 0x48003a,
            midtoneColor: 0x110022,
            lowlightColor: 0x4500a2,
            baseColor: 0x0,
            blurFactor: 0.5,
            speed: 1,
            zoom: 1
        })
        </script>
        <div class="content">
            <div id="dateTime">
                <h1 id="time">00:00</h1>
                <!-- <h2 id="date">Wednesday 16th 2026</h1> -->
            </div>

            <div id="search-bar">
                <!-- <h2>Search Bar Here</h2> -->
                <input type="search" id="search-bar-input" name="search-bar" placeholder="Search on Google" autofocus autocomplete="off">
                <button id="search-bar-submit">🔎︎</button>
            </div>

            <div id="widgets">
                <div id="shortcuts" class="widget">
                    <h2>Widget 1</h2>
                </div>
                <div id="shortcuts" class="widget">
                    <h2>Widget 2</h2>
                </div>
                <div id="shortcuts" class="widget">
                    <h2>Widget 3</h2>
                </div>
            </div>
        </div>

        <script src="scripts/main.js"></script>
    </body>
</html>
